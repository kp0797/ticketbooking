services:

  postgres:
    image: postgres:18.6
    container_name: ticketbooking-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ticketbooking
      POSTGRES_USER: ticketbooking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: