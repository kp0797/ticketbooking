name: Ticket Booking CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # These service containers support tests that use localhost datasource/cache
    # settings. Testcontainers-based tests can also start their own containers.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: ticketbooking
          POSTGRES_USER: ticketbooking
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketbooking -d ticketbooking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
